name: Frontend QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CHROME_VERSION: '158.0.8127.36'
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install Chrome for Testing
        run: |
          archive="$RUNNER_TEMP/chrome-linux64.zip"
          curl --fail --show-error --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "CHROME_PATH=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/chrome-linux64/chrome" --version
      - name: Run unit and browser regression tests
        run: node --test tests/unit.test.cjs tests/browser.test.cjs
